# Decap CMS configuration for the Lasău village site.
# See README.md in the project root for how to enable this (Netlify Identity + Git Gateway).

backend:
  name: git-gateway
  branch: main

# Uncomment to test the CMS locally without deploying (see README "Local testing").
# local_backend: true

# Editorial workflow: every change becomes a draft with a real deploy-preview
# link before it goes live, instead of publishing instantly.
publish_mode: editorial_workflow

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "pages"
    label: "Pagini / Pages"
    files:
      - file: "content/pages/home.json"
        label: "Pagina Acasă / Home page"
        name: "home"
        fields:
          - label: "Titlu principal / Hero title"
            name: "hero_title"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Subtitlu / Hero subtitle"
            name: "hero_subtitle"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "text" }
              - { label: "EN", name: "en", widget: "text", required: false }
          - { label: "Fotografie principală / Hero photo", name: "hero_image", widget: "image", required: false, hint: "Înlocuiește ilustrația cu dealuri." }
          - label: "Titlu secțiune Știri / News section heading"
            name: "news_heading"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Titlu secțiune Istorie / History section heading"
            name: "history_heading"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Știri recomandate pe Acasă / Featured news"
            name: "featured_news"
            widget: "relation"
            collection: "news"
            file: "news"
            search_fields: ["posts.*.title.ro", "posts.*.slug"]
            value_field: "posts.*.slug"
            display_fields: ["posts.*.title.ro"]
            multiple: true
            required: false
            hint: "Lasă gol pentru a afișa automat cele mai recente 2 știri."
          - label: "Articole de istorie recomandate pe Acasă / Featured history"
            name: "featured_history"
            widget: "relation"
            collection: "history"
            file: "history"
            search_fields: ["posts.*.title.ro", "posts.*.slug"]
            value_field: "posts.*.slug"
            display_fields: ["posts.*.title.ro"]
            multiple: true
            required: false
            hint: "Lasă gol pentru a afișa automat cele mai recente 2 articole."
          - label: "Secțiuni de conținut / Content sections"
            name: "sections"
            widget: "list"
            label_singular: "Secțiune / Section"
            summary: "{{fields.heading.ro}}"
            required: false
            hint: "Secțiuni suplimentare care apar pe Acasă, sub articolele recomandate (opțional). Lasă gol dacă nu vrei."
            fields:
              - label: "Titlu secțiune / Section heading"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string", required: false }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Text / Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }
              - { label: "Fotografie (opțional) / Photo (optional)", name: "image", widget: "image", required: false }

      - file: "content/pages/about.json"
        label: "Pagina Despre sat / About page"
        name: "about"
        fields:
          - label: "Titlu / Title"
            name: "title"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Introducere / Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "text" }
              - { label: "EN", name: "en", widget: "text", required: false }
          - { label: "Fotografie / Photo", name: "image", widget: "image", required: false }
          - label: "Secțiuni de conținut / Content sections"
            name: "sections"
            widget: "list"
            label_singular: "Secțiune / Section"
            summary: "{{fields.heading.ro}}"
            required: false
            hint: "Fiecare secțiune apare ca o casetă pe pagină. Le poți adăuga, șterge și reordona (trage de bara =)."
            fields:
              - label: "Titlu secțiune / Section heading"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string", required: false }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Text / Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }
              - { label: "Fotografie (opțional) / Photo (optional)", name: "image", widget: "image", required: false }

      - file: "content/pages/contact.json"
        label: "Pagina Contact / Contact page"
        name: "contact"
        fields:
          - label: "Titlu / Title"
            name: "title"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Introducere / Intro"
            name: "intro"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "text" }
              - { label: "EN", name: "en", widget: "text", required: false }
          - label: "Secțiuni de conținut / Content sections"
            name: "sections"
            widget: "list"
            label_singular: "Secțiune / Section"
            summary: "{{fields.heading.ro}}"
            required: false
            hint: "Fiecare secțiune apare ca o casetă pe pagină. Le poți adăuga, șterge și reordona (trage de bara =)."
            fields:
              - label: "Titlu secțiune / Section heading"
                name: "heading"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string", required: false }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Text / Text"
                name: "text"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }
              - { label: "Fotografie (opțional) / Photo (optional)", name: "image", widget: "image", required: false }
          - { label: "Email de contact", name: "email", widget: "string", required: false, hint: "Apare într-o casetă separată, la finalul paginii. Lasă gol ca să nu apară." }

  - name: "news"
    label: "Știri / News"
    files:
      - file: "content/news/news.json"
        label: "Toate știrile / All news posts"
        name: "news"
        fields:
          - label: "Titlul paginii / Page title"
            name: "page_title"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Introducerea paginii / Page intro"
            name: "page_intro"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "text" }
              - { label: "EN", name: "en", widget: "text", required: false }
          - label: "Articole / Posts"
            name: "posts"
            widget: "list"
            label_singular: "Articol / Post"
            summary: "{{fields.title.ro}}"
            fields:
              - { label: "URL articol (generat automat)", name: "slug", widget: "hidden", default: "" }
              - { label: "Data (generată automat)", name: "date", widget: "hidden", default: "" }
              - { label: "Fotografie (opțional) / Photo (optional)", name: "image", widget: "image", required: false }
              - label: "Titlu / Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Rezumat / Excerpt"
                name: "excerpt"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }
              - label: "Text integral / Full text"
                name: "body"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }

  - name: "history"
    label: "Istorie / History"
    files:
      - file: "content/history/history.json"
        label: "Toate articolele de istorie / All history posts"
        name: "history"
        fields:
          - label: "Titlul paginii / Page title"
            name: "page_title"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Introducerea paginii / Page intro"
            name: "page_intro"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "text" }
              - { label: "EN", name: "en", widget: "text", required: false }
          - label: "Articole / Posts"
            name: "posts"
            widget: "list"
            label_singular: "Articol / Post"
            summary: "{{fields.title.ro}}"
            fields:
              - { label: "URL articol (generat automat)", name: "slug", widget: "hidden", default: "" }
              - { label: "Data (generată automat)", name: "date", widget: "hidden", default: "" }
              - { label: "Fotografie (opțional) / Photo (optional)", name: "image", widget: "image", required: false }
              - label: "Titlu / Title"
                name: "title"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Rezumat / Excerpt"
                name: "excerpt"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }
              - label: "Text integral / Full text"
                name: "body"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "text" }
                  - { label: "EN", name: "en", widget: "text", required: false }

  - name: "site"
    label: "Antet și subsol / Header & footer"
    files:
      - file: "content/site.json"
        label: "Antet, subsol și etichete / Header, footer & labels"
        name: "site"
        fields:
          - { label: "Numele site-ului (apare în antet, stânga sus)", name: "site_name", widget: "string", hint: "Ex: Lăsău" }
          - label: "Descriere scurtă (apare în titlul tabului din browser) / Tagline"
            name: "site_tagline"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string", required: false }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Meniu din antet / Header menu"
            name: "nav"
            widget: "object"
            fields:
              - label: "Acasă"
                name: "home"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Știri"
                name: "news"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Istorie"
                name: "history"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Despre sat"
                name: "about"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Contact"
                name: "contact"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Text din subsol / Footer text"
            name: "footer_text"
            widget: "object"
            fields:
              - { label: "RO", name: "ro", widget: "string" }
              - { label: "EN", name: "en", widget: "string", required: false }
          - label: "Linkuri din subsol / Footer links"
            name: "footer_links"
            widget: "list"
            label_singular: "Link"
            summary: "{{fields.label.ro}}"
            required: false
            hint: "Linkurile mici din dreapta subsolului. Le poți adăuga, șterge și reordona."
            fields:
              - label: "Text link / Link text"
                name: "label"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - { label: "Adresa linkului", name: "url", widget: "string", hint: "Pagină din site: news.html, history.html, about.html, contact.html — sau o adresă completă: https://..." }
          - label: "Etichete butoane și mesaje / Button labels & messages"
            name: "labels"
            widget: "object"
            fields:
              - label: "Buton „Vezi tot”"
                name: "see_all"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Buton „Citește mai mult”"
                name: "read_more"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Buton „Înapoi la listă”"
                name: "back_to_list"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Mesaj când nu sunt știri"
                name: "empty_news"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Mesaj când nu sunt articole de istorie"
                name: "empty_history"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
              - label: "Mesaj articol negăsit"
                name: "not_found"
                widget: "object"
                fields:
                  - { label: "RO", name: "ro", widget: "string" }
                  - { label: "EN", name: "en", widget: "string", required: false }
